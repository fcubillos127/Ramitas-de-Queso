name: G0 audit

on:
  push:
    branches:
      - audit/g0-certification
  pull_request:
    branches:
      - claude/code-review-optimization-49vxac

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run G0 certification tests
        run: python -m unittest discover -s tests -p 'test_g0*.py' -v
