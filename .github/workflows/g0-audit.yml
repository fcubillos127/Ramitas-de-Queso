name: Numerical certification

on:
  push:
    branches:
      - audit/g0-certification
  pull_request:
    branches:
      - claude/code-review-optimization-49vxac

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run numerical certification tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run Gamma modal-subspace audit
        run: >-
          python scripts_figs/audit_modal_gamma.py
          --k-over-pi 0.75 0.875 1.0 1.125 1.25
          --n-suma 60
          --ngrid 140
          --max-delta 0.25
