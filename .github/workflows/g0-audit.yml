name: Numerical certification

on:
  push:
    branches:
      - audit/g0-certification
  pull_request:
    branches:
      - claude/code-review-optimization-49vxac

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run numerical certification tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run modal-guided Gamma-X completion audit
        run: >-
          python scripts_figs/audit_modal_completion_gamma.py
          --n-suma 40
          --coarse-ngrid 140
          --targeted-max-depth 5
          --half-width 0.06
      - name: Run bidirectional modal path audit around Gamma
        run: >-
          python scripts_figs/audit_modal_path_gamma.py
          --n-suma 40
          --ngrid 120
          --k-over-pi 0.75 0.875 1.0 1.125 1.25
          --w-min 0.70
          --w-max 1.40
          --half-width 0.08
          --max-sweeps 3
      - name: Run dk convergence audit around Gamma
        run: >-
          python scripts_figs/audit_dk_convergence_gamma.py
          --n-suma 40
          --ngrid 100
