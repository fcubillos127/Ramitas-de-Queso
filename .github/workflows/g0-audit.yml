name: Numerical certification

on:
  push:
    branches:
      - audit/g0-certification
  pull_request:
    branches:
      - claude/code-review-optimization-49vxac

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run numerical certification tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run dense adaptive n_suma audit
        run: >-
          python scripts_figs/audit_adaptive_nsum_path.py
          --nk 13
          --ngrid 120
          --n-schedule 8 12 20 30 40 60 80
          --stable-steps 2
          --confirmation-steps 1
          --freq-atol 5e-5
          --freq-rtol 5e-5
          --residual-tol 1e-6
