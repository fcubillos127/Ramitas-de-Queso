name: Numerical certification

on:
  pull_request:
    branches:
      - claude/code-review-optimization-49vxac

concurrency:
  group: numerical-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run numerical certification tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run closed global baseline v1
        run: >-
          python scripts_figs/audit_global_baseline_v1.py
          --n-suma 40
          --ngrid 110
          --points-per-segment 9
          --w-min 0.70
          --w-max 1.40
          --search-w-max 1.50
